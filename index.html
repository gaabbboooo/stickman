<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Adventure</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    /* Botones táctiles */
    .control-btn {
      position: fixed;
      width: 60px;
      height: 60px;
      background-color: rgba(0,0,0,0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 20px;
      z-index: 10;
      user-select: none;
    }
    #leftBtn { bottom: 20px; left: 20px; }
    #rightBtn { bottom: 20px; left: 100px; }
    #jumpBtn { bottom: 20px; right: 20px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Botones táctiles -->
  <div id="leftBtn" class="control-btn">&#8592;</div>
  <div id="rightBtn" class="control-btn">&#8594;</div>
  <div id="jumpBtn" class="control-btn">&#8593;</div>

  <script src="game.js"></script>
</body>
</html>

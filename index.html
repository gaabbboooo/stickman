<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Stickman – Test Build</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas {
      display: block;
    }
    .btn {
      position: fixed;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      color: white;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      z-index: 10;
    }
    #left { bottom: 20px; left: 20px; }
    #right { bottom: 20px; left: 120px; }
    #jump { bottom: 20px; right: 20px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="left" class="btn">◀</div>
  <div id="right" class="btn">▶</div>
  <div id="jump" class="btn">▲</div>

  <script src="game.js"></script>
</body>
</html>
